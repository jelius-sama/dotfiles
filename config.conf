# Image width in characters
img_width=40

# Space between image and text (in columns)
text_offset=4

# Crop mode: "auto" (preserve aspect) or "fill" (crop to fit)
crop_mode=fill

# Default image path (optional, can be overridden by command line)
image_path=~/.config/neofetch/image/IMG_4651.PNG

backend=neofetch
