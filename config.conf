# ══════════════════════════════════════════════════════════════════════════
# neofetch config — Catppuccin Mocha
# ══════════════════════════════════════════════════════════════════════════

distro="Fedora"
kernel="Asahi Linux"

gap=4
col_offset="auto"

bold="on"
underline_enabled="off"

colors=(5 7 5 6 5 7)

# Single space replaces the ":" neofetch inserts. Must be non-empty.
separator=" "

printf "\n"
print_info() {
    info title
    info underline

    local M=$'\e[38;2;203;166;247m'   # Catppuccin Mocha mauve  #cba6f7 — labels
    local T=$'\e[38;2;205;214;244m'   # Catppuccin Mocha text   #cdd6f4 — values
    local R=$'\e[0m'
    local nbsp
    nbsp=$(printf "\xc2\xa0")          # non-breaking space — survives trim()
    local LONGEST=8                    # len("terminal")

    _row() {
        local label="$1" value="$2"
        local pad_n pad
        pad_n=$(( LONGEST - ${#label} + 1 ))
        pad=$(printf "%${pad_n}s" "" | sed "s/ /${nbsp}/g")
        # Escape codes survive trim() fine — only [[:space:]] gets stripped.
        # So we can color the label directly here.
        prin "${M}${label}${R}" "${pad}${T}${value}${R}"
    }

    # ── system ──────────────────────────────────────────────────────────
    _row "kernel"   "$kernel"
    _row "os"       "$distro"
    prin " "

    # Copy pasted directly from fastfecth because I don't know how to query and format these
    _row "cpu" "Apple M2 (4+4) @ 3.20 GHz"
    _row "display" "2560x1664 @ 2x in 14, 60 Hz"
    prin " "

    local _up
    _up=$(uptime -p 2>/dev/null | sed 's/up //')

    local _sh _shv
    _sh=$(basename "$SHELL")
    _shv=$($SHELL --version 2>&1 | grep -oP '\d+\.\d+[\.\d]*' | head -1)

    local _term
    if   [[ -n "$TMUX" ]];            then _term="tmux"
    elif [[ -n "$KITTY_WINDOW_ID" ]]; then _term="kitty"
    elif [[ -n "$TERM_PROGRAM" ]];    then _term="${TERM_PROGRAM,,}"
    else                                   _term="${TERM:-unknown}"
    fi

    _row "wm" "Hyprland"
    _row "shell"    "$_sh $_shv"
    _row "terminal" "$_term"
    _row "theme" "$(omarchy-theme-current) \\e[38m●\\e[37m●\\e[36m●\\e[35m●\\e[34m●\\e[33m●\\e[32m●\\e[31m●"
    _row "uptime"   "$_up"

    prin ""

    # ── music ───────────────────────────────────────────────────────────
    local found=false artist album title

    for instance in $(playerctl -l 2>/dev/null | grep firefox); do
        if playerctl -p "$instance" status &>/dev/null; then
            local url
            url=$(playerctl -p "$instance" metadata xesam:url 2>/dev/null)
            if [[ $url == https://music.apple.com* ]]; then
                artist=$(playerctl -p "$instance" metadata xesam:artist 2>/dev/null)
                album=$( playerctl -p "$instance" metadata xesam:album  2>/dev/null)
                title=$( playerctl -p "$instance" metadata xesam:title  2>/dev/null)
                found=true; break
            fi
        fi
    done

    # NOTE: There's a catch with chromium based browser without a custom patch, it doesn't broadcast the URL through D-Bus
    # The temporary fix is to see if there is an album art, if there is then we can assume that it is possibly Apple Music though we can never be certain
    if [[ $found == false ]]; then
        for instance in $(playerctl -l 2>/dev/null | grep chromium); do
            if playerctl -p "$instance" status &>/dev/null; then
                local art
                art=$(playerctl -p "$instance" metadata mpris:artUrl 2>/dev/null)
                if [[ -n $art ]]; then
                    artist=$(playerctl -p "$instance" metadata xesam:artist 2>/dev/null)
                    album=$( playerctl -p "$instance" metadata xesam:album  2>/dev/null)
                    title=$( playerctl -p "$instance" metadata xesam:title  2>/dev/null)
                    found=true; break
                fi
            fi
        done
    fi

    artist=${artist:-"—"}
    album=${album:-"—"}
    title=${title:-"not playing"}

    # _row "source"   "apple music"
    _row "artist"   "$artist"
    _row "album"    "$album"
    _row "song"     "$title"
    prin ""
}

# ── flags ──────────────────────────────────────────────────────────────────
kernel_shorthand="on"
distro_shorthand="off"
os_arch="off"
uptime_shorthand="on"
memory_unit="mib"
memory_percent="off"
shell_path="off"
shell_version="on"

color_blocks="on"
block_range=(0 15)
block_width=2
block_height=1

cpu_display="off"
memory_display="off"
battery_display="off"
disk_display="off"
title_fqdn="off"
packages="off"
de_version="off"
disk_show=('/')
disk_percent="off"
